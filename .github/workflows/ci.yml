name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install backend dependencies
        run: npm ci
        working-directory: apps/backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend
      - name: Lint backend (ESLint)
        run: npm run lint
        working-directory: apps/backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend
      - name: Lint frontend (ESLint)
        run: npm run lint
        working-directory: apps/frontend
      - name: Validate workflows (actionlint)
        uses: raven-actions/actionlint@v2

  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # --- Backend (gate 80% linhas/branches) ---
      - name: Install backend dependencies
        run: npm ci
        working-directory: apps/backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/backend
      - name: Backend coverage gate
        run: npm run test:cov
        working-directory: apps/backend
      - name: Build backend
        run: npm run build
        working-directory: apps/backend

      # --- Frontend (gate 70% linhas/branches) ---
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend
      - name: Frontend coverage gate
        run: npm run test:cov
        working-directory: apps/frontend
      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

      # --- Relatórios publicados mesmo em falha do gate ---
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/backend/coverage/
            apps/frontend/coverage/
          retention-days: 30

  playwright-e2e:
    name: Playwright E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delivery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delivery
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies (Playwright runner)
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: ./apps/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./apps/frontend

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: ./apps/backend

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: ./apps/backend

      - name: Seed database
        run: npx prisma db seed
        working-directory: ./apps/backend

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
